[project]
name = "thinknxg_workspace_studio"
authors = [
    { name = "Kreatao", email = "kreataothinkcadd@gmail.com" }
]
description = "thinkNXG Workspace Studio - visual drag-and-drop workspace, sidebar and dock designer for thinkNXG ERP v16"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
